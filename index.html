<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lab Terminal - MetaFold Light</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-4 sm:p-6 pb-20">
  <div id="app" class="max-w-xl mx-auto space-y-6">

    <!-- Header & Config -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">MetaFold Terminal</h1>
          <p class="text-xs text-slate-500">Live Dictation & Metadata Dispatch</p>
        </div>
        <button @click="showConfig = !showConfig" class="text-xs px-3 py-1.5 bg-slate-100 rounded-lg border border-slate-300 font-medium">
          ⚙️ {{ showConfig ? 'Schließen' : 'Setup' }}
        </button>
      </div>

      <div v-if="showConfig" class="mt-4 pt-4 border-t border-slate-100 space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">GitHub Templates URL (Raw JSON oder Repo-URL)</label>
          <input v-model="config.githubUrl" type="url" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://github.com/ThZobel/MetaFold-Templates">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">n8n Webhook URL</label>
          <input v-model="config.n8nWebhookUrl" type="url" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://n8n.your-lab.de/webhook/...">
        </div>
        <div class="flex gap-2">
          <button @click="saveConfig" class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-lg font-medium">Speichern & Laden</button>
          <button @click="loadMockTemplates" class="text-xs bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg">Demo-Daten</button>
        </div>
      </div>
    </header>

    <!-- 1. Template-Auswahl -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <label class="block text-sm font-semibold text-slate-700">1. Template wählen</label>
      <div v-if="loadingTemplates" class="text-xs text-slate-400">Templates werden geladen...</div>
      <select v-else v-model="selectedTemplateId" @change="initForm" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="" disabled>Bitte Vorlage wählen</option>
        <optgroup v-for="(groupTemplates, group) in groupedTemplates" :label="group" :key="group">
          <option v-for="t in groupTemplates" :key="t.id" :value="t.id">{{ t.name }}</option>
        </optgroup>
      </select>
    </section>

    <!-- 2. Formular + Direktes Diktieren -->
    <section v-if="currentTemplate" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-sm font-semibold text-slate-700">2. Eingabe & Diktat</h2>
      
      <div v-for="field in currentTemplate.fields" :key="field.key" class="space-y-1">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-medium text-slate-600">
            {{ field.label }} <span v-if="field.required" class="text-red-500">*</span>
          </label>
          <!-- Mikrofon-Button direkt am Feld -->
          <button 
            type="button" 
            @click="toggleSpeech(field.key)"
            :class="activeSpeechField === field.key ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
            class="text-[11px] px-2 py-0.5 rounded-md flex items-center gap-1 transition">
            <span>🎙️</span>
            <span>{{ activeSpeechField === field.key ? 'Hört zu...' : 'Diktieren' }}</span>
          </button>
        </div>
        
        <!-- Text Input -->
        <input v-if="field.type === 'text'" v-model="formData[field.key]" type="text" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        
        <!-- Select -->
        <select v-else-if="field.type === 'select'" v-model="formData[field.key]" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Auswählen...</option>
          <option v-for="opt in field.options" :key="opt" :value="opt">{{ opt }}</option>
        </select>

        <!-- Textarea -->
        <textarea v-else-if="field.type === 'textarea'" v-model="formData[field.key]" rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>
    </section>

    <!-- 3. Absenden -->
    <section>
      <button 
        @click="sendPayload" 
        :disabled="isSubmitting || !currentTemplate"
        class="w-full py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white rounded-2xl font-semibold shadow-md active:scale-[0.99] transition">
        <span v-if="isSubmitting">Wird übertragen...</span>
        <span v-else>🚀 Metadaten übertragen</span>
      </button>

      <div v-if="statusMessage" :class="statusSuccess ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-200'" class="mt-4 p-3.5 rounded-xl border text-xs font-medium text-center">
        {{ statusMessage }}
      </div>
    </section>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const showConfig = ref(false);
        const config = ref({
          githubUrl: localStorage.getItem('metafold_github_url') || 'https://github.com/ThZobel/MetaFold-Templates',
          n8nWebhookUrl: localStorage.getItem('metafold_n8n_url') || ''
        });

        const templates = ref([]);
        const loadingTemplates = ref(false);
        const selectedTemplateId = ref('');
        const formData = ref({});

        // Speech Recognition State
        const activeSpeechField = ref(null);
        let recognition = null;

        // Status
        const isSubmitting = ref(false);
        const statusMessage = ref('');
        const statusSuccess = ref(true);

        const currentTemplate = computed(() => templates.value.find(t => t.id === selectedTemplateId.value));
        const groupedTemplates = computed(() => {
          return templates.value.reduce((acc, t) => {
            const group = t.group || 'Allgemein';
            if (!acc[group]) acc[group] = [];
            acc[group].push(t);
            return acc;
          }, {});
        });

        // Templates von GitHub laden (Automatische API-/Raw-Erkennung)
        const fetchTemplates = async () => {
          loadingTemplates.value = true;
          statusMessage.value = '';

          let targetUrl = config.value.githubUrl.trim();

          // Konvertiert Standard-GitHub-URLs in die GitHub API oder Raw URL
          if (targetUrl.includes('github.com') && !targetUrl.includes('raw.githubusercontent.com') && !targetUrl.includes('api.github.com')) {
            const parts = targetUrl.replace('https://github.com/', '').split('/');
            const owner = parts[0];
            const repo = parts[1];
            // Sucht standardmäßig nach templates.json im main branch
            targetUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/templates.json`;
          }

          try {
            const res = await fetch(targetUrl + '?t=' + Date.now());
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            templates.value = await res.json();
            statusSuccess.value = true;
          } catch (err) {
            console.warn('Laden via Raw fehlgeschlagen, nutze Fallback-Daten:', err);
            statusMessage.value = `Konnte ${targetUrl} nicht laden. Stelle sicher, dass die Datei existiert und public ist. (Demo-Daten geladen)`;
            statusSuccess.value = false;
            loadMockTemplates();
          } finally {
            loadingTemplates.value = false;
          }
        };

        const loadMockTemplates = () => {
          templates.value = [
            {
              id: 'confocal_demo',
              group: 'Konfokal',
              name: 'Konfokalmikroskopie Session',
              fields: [
                { key: 'project', label: 'Projekt-ID', type: 'text', required: true },
                { key: 'sample', label: 'Probenbezeichnung', type: 'text', required: true },
                { key: 'objective', label: 'Objektiv', type: 'select', options: ['20x Multi', '40x Oil', '63x Oil'] },
                { key: 'notes', label: 'Notizen / Befund', type: 'textarea' }
              ]
            }
          ];
        };

        const initForm = () => {
          formData.value = {};
          if (currentTemplate.value) {
            currentTemplate.value.fields.forEach(f => { formData.value[f.key] = ''; });
          }
        };

        // --- Web Speech API (Direkte Spracherkennung auf dem Smartphone) ---
        const initSpeechRecognition = () => {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) return null;

          const rec = new SpeechRecognition();
          rec.lang = 'de-DE';
          rec.continuous = false;
          rec.interimResults = false;

          rec.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (activeSpeechField.value) {
              const current = formData.value[activeSpeechField.value] || '';
              formData.value[activeSpeechField.value] = current ? `${current} ${transcript}` : transcript;
            }
          };

          rec.onerror = (e) => {
            console.error('Spracherkennungsfehler:', e.error);
            if (e.error === 'not-allowed') {
              alert('Mikrofonzugriff verweigert. Bitte HTTPS verwenden und Berechtigungen im Browser prüfen!');
            }
            activeSpeechField.value = null;
          };

          rec.onend = () => {
            activeSpeechField.value = null;
          };

          return rec;
        };

        const toggleSpeech = (fieldKey) => {
          if (!window.isSecureContext) {
            alert('Achtung: Spracherkennung erfordert eine sichere Verbindung (HTTPS)!');
            return;
          }

          if (activeSpeechField.value === fieldKey) {
            recognition?.stop();
            activeSpeechField.value = null;
            return;
          }

          if (!recognition) {
            recognition = initSpeechRecognition();
          }

          if (!recognition) {
            alert('Dieser Browser unterstützt keine direkte Spracherkennung (Web Speech API).');
            return;
          }

          activeSpeechField.value = fieldKey;
          recognition.start();
        };

        const saveConfig = () => {
          localStorage.setItem('metafold_github_url', config.value.githubUrl);
          localStorage.setItem('metafold_n8n_url', config.value.n8nWebhookUrl);
          showConfig.value = false;
          fetchTemplates();
        };

        // Reines JSON an n8n senden (kein Binary-Overhead)
        const sendPayload = async () => {
          if (!config.value.n8nWebhookUrl) {
            alert('Bitte erst n8n Webhook URL eintragen (⚙️ Setup).');
            showConfig.value = true;
            return;
          }

          isSubmitting.value = true;
          statusMessage.value = '';

          try {
            const payload = {
              timestamp: new Date().toISOString(),
              template: {
                id: currentTemplate.value.id,
                name: currentTemplate.value.name,
                group: currentTemplate.value.group
              },
              fields: formData.value
            };

            const res = await fetch(config.value.n8nWebhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error('HTTP ' + res.status);

            statusSuccess.value = true;
            statusMessage.value = '✓ Erfolgreich übertragen!';
            initForm();
          } catch (err) {
            statusSuccess.value = false;
            statusMessage.value = 'Fehler beim Senden: ' + err.message;
          } finally {
            isSubmitting.value = false;
          }
        };

        onMounted(() => {
          fetchTemplates();
        });

        return {
          showConfig,
          config,
          templates,
          loadingTemplates,
          selectedTemplateId,
          currentTemplate,
          groupedTemplates,
          formData,
          activeSpeechField,
          isSubmitting,
          statusMessage,
          statusSuccess,
          saveConfig,
          loadMockTemplates,
          initForm,
          toggleSpeech,
          sendPayload
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
